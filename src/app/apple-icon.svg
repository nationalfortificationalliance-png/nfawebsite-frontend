<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 180 180">
  <defs>
    <linearGradient id="greenGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#008751" />
      <stop offset="100%" stop-color="#006639" />
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#d97706" />
    </linearGradient>
  </defs>

  <!-- Background - Nigeria Green -->
  <rect width="180" height="180" fill="url(#greenGrad)" />

  <!-- Simplified Nigeria map with cross -->
  <g transform="translate(25, 35)">
    <!-- Nigeria outline -->
    <path d="M 15 0
             L 110 0
             Q 125 8 125 25
             L 125 60
             Q 125 75 115 85
             L 100 100
             Q 90 110 75 110
             L 50 110
             Q 35 110 25 100
             L 10 85
             Q 0 75 0 60
             L 0 25
             Q 0 8 15 0 Z"
             fill="#004d2c"/>

    <!-- Medical cross -->
    <rect x="48" y="22" width="28" height="66" rx="2" fill="white"/>
    <rect x="34" y="36" width="56" height="38" rx="2" fill="white"/>
  </g>

  <!-- Wheat and drop accent -->
  <g transform="translate(120, 120)">
    <!-- Wheat stalk -->
    <path d="M 0 0 Q 3 10 2 20 Q 0 30 0 40"
          stroke="url(#goldGrad)"
          stroke-width="3"
          fill="none"/>
    <!-- Grains -->
    <ellipse cx="-3" cy="10" rx="4" ry="3" fill="#f59e0b"/>
    <ellipse cx="3" cy="15" rx="4" ry="3" fill="#f59e0b"/>
    <ellipse cx="-3" cy="20" rx="4" ry="3" fill="#f59e0b"/>
    <ellipse cx="3" cy="25" rx="4" ry="3" fill="#f59e0b"/>

    <!-- Drop -->
    <path d="M 20 15 Q 20 8 26 0 Q 32 8 32 15 Q 32 22 26 28 Q 20 22 20 15 Z"
          fill="url(#goldGrad)"/>
  </g>
</svg>
