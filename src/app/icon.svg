<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="greenGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#008751" />
      <stop offset="100%" stop-color="#006639" />
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#d97706" />
    </linearGradient>
  </defs>

  <!-- Background - Nigeria Green -->
  <rect width="512" height="512" rx="96" fill="url(#greenGrad)" />

  <!-- Simplified Nigeria map shape with cross -->
  <g transform="translate(80, 120)">
    <!-- Nigeria outline approximation -->
    <path d="M 40 0
             L 300 0
             Q 340 20 340 60
             L 340 140
             Q 340 180 320 200
             L 280 240
             Q 260 260 220 260
             L 120 260
             Q 80 260 60 240
             L 20 200
             Q 0 180 0 140
             L 0 60
             Q 0 20 40 0 Z"
             fill="#006639"
             stroke="#004d2c"
             stroke-width="4"/>

    <!-- Medical cross - centered -->
    <rect x="130" y="60" width="80" height="140" rx="4" fill="white"/>
    <rect x="90" y="100" width="160" height="60" rx="4" fill="white"/>
  </g>

  <!-- Wheat grain and drop accent (bottom right) -->
  <g transform="translate(340, 340)">
    <!-- Wheat stalk -->
    <path d="M 0 0 Q 10 30 5 60 Q 0 90 0 120"
          stroke="url(#goldGrad)"
          stroke-width="8"
          fill="none"
          stroke-linecap="round"/>

    <!-- Wheat grains -->
    <ellipse cx="-8" cy="30" rx="12" ry="8" fill="#f59e0b" opacity="0.9"/>
    <ellipse cx="8" cy="45" rx="12" ry="8" fill="#f59e0b" opacity="0.9"/>
    <ellipse cx="-8" cy="60" rx="12" ry="8" fill="#f59e0b" opacity="0.9"/>
    <ellipse cx="8" cy="75" rx="12" ry="8" fill="#f59e0b" opacity="0.9"/>
    <ellipse cx="-6" cy="90" rx="10" ry="7" fill="#f59e0b" opacity="0.9"/>

    <!-- Fortification drop -->
    <path d="M 60 40
             Q 60 20 75 0
             Q 90 20 90 40
             Q 90 60 75 75
             Q 60 60 60 40 Z"
             fill="url(#goldGrad)"/>
  </g>
</svg>
